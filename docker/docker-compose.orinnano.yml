version: '3.8'

services:
  vlm_container:
    image: picowcar/jetson-vlm:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.orinnano
    container_name: picowcar-vlm-instance
    runtime: nvidia
    network_mode: host
    privileged: true
    
    # GPU access
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=0
      
      # VLM Configuration
      - VLM_MODEL=Qwen/Qwen2.5-VL-3B-Instruct  # Lightweight for Orin Nano
      - VLM_QUANTIZATION=bnb4
      - HF_HOME=/data/models/huggingface
      - TRANSFORMERS_CACHE=/data/models/huggingface
      
      # ROS2 settings
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
    
    volumes:
      # Model persistence across container runs
      - ./docker/models:/data/models
      
      # Camera device access
      - /dev:/dev:ro
      - /sys:/sys:ro
      
      # Logs
      - ./logs/vlm:/data/logs
      
      # Optional: Share ROS topics with host
      - /tmp/ros:/tmp/ros
    
    # Resource limits - adjust based on your Orin Nano specs
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

