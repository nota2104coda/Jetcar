# Production environment for Raspberry Pi 5
version: '3.8'

services:
  robot-controller:
    build:
      context: ..  # Build from parent directory
      dockerfile: docker/Dockerfile
    container_name: robot-controller
    # Need privileged access for hardware
    privileged: true
    devices:
      # I2C bus for VL53L5X lidar
      - "/dev/i2c-1:/dev/i2c-1"
      # GPIO access
      - "/dev/gpiomem:/dev/gpiomem"
      # Camera device (if using USB camera)
      - "/dev/video0:/dev/video0"
    volumes:
      # Mount config and source
      - ../config:/app/config
      - ../pc-src:/app/pc-src
      - ../logs:/app/logs
      # Camera libraries for Pi Camera
      - /opt/vc:/opt/vc:ro
      # Device tree for hardware access
      - /sys:/sys:ro
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - MOCK_HARDWARE=false
      - PICO_W_IP=192.168.1.100
    # Always restart if container stops
    restart: unless-stopped
    # Health check to monitor robot status
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"