# Development environment for Windows 11
version: '3.8'

services:
  # Python robot controller
  robot-dev:
    build:
      context: ..  # Build from parent directory (PicoWCar/)
      dockerfile: docker/Dockerfile
    container_name: robot-dev
    volumes:
      # Mount source code for live editing
      - ../pc-src:/app/pc-src
      - ../config:/app/config
      # Mount a logs directory
      - ../logs:/app/logs
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - LOG_LEVEL=DEBUG
      # Mock hardware since we're on Windows
      - MOCK_HARDWARE=true
      - PICO_W_IP=192.168.1.100
    ports:
      # Expose web interface if you add one later
      - "8080:8080"
      # Expose debugging port
      - "5678:5678"
    # Restart policy
    restart: unless-stopped
    # Keep container running even if main script exits (for debugging)
    stdin_open: true
    tty: true

  # Arduino compilation environment
  arduino-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile.arduino
    container_name: arduino-dev
    volumes:
      # Mount Arduino projects
      - ../arduino-mega:/workspace/arduino-mega
      - ../picow:/workspace/picow
      - ../include-arduino:/workspace/include-arduino
      # Mount build output
      - ../build:/workspace/build
    working_dir: /workspace
    # Keep container running for interactive use
    stdin_open: true
    tty: true
    command: /bin/bash