controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["simple_goal_checker"]
    controller_plugins: ["regulated_pure_pursuit"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 10.0
    simple_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.15
      stateful: true
    regulated_pure_pursuit:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      max_linear_accel: 0.8
      max_rotational_vel: 1.0
      min_lookahead_dist: 0.2
      max_lookahead_dist: 1.2
      lookahead_time: 1.5
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      lookahead_dist: 0.6
      enable_overshoot_handling: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 0.5
      slowdown_ratio: 0.8
      odom_topic: "/odometry/filtered"

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.25
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-3
      max_its: 100
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    behavior_plugins: ["spin", "backup", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"

bt_navigator:
  ros__parameters:
    use_sim_time: false
    plugin_lib_names: ["nav2_behavior_tree::BtActionServer"]
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_server_timeout: 20.0
    wait_for_server_timeout: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    plugin_lib_names: ["nav2_waypoint_follower::FollowWaypoints"]

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true
    alpha: 0.5
    beta: 0.1
    tolerance: 0.010
    max_velocity: [0.8, 0.0, 1.2]
    min_velocity: [-0.4, 0.0, -1.2]
    max_accel: [0.8, 0.0, 1.5]
    max_decel: [0.8, 0.0, 1.5]
    odom_topic: "/odometry/filtered"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 10.0
      publish_frequency: 10.0
      transform_tolerance: 0.4
      rolling_window: true
      width: 10.0
      height: 10.0
      resolution: 0.05
      robot_radius: 0.28
      plugins: ["nvblox_layer", "lidar_obstacles", "inflation_layer"]
      nvblox_layer:
        plugin: "nvblox_nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: false
        max_obstacle_distance: 3.0
        inflation_distance: 0.6
      lidar_obstacles:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: lidar_scan
        lidar_scan:
          topic: /scan
          max_obstacle_height: 1.5
          min_obstacle_height: 0.05
          clearing: true
          marking: true
          obstacle_range: 8.0
          raytrace_range: 10.0
          inf_is_valid: false
          data_type: LaserScan
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.6
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 0.8
      resolution: 0.10
      robot_radius: 0.28
      rolling_window: false
      track_unknown_space: true
      plugins: ["static_layer", "nvblox_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: /map
        subscribe_to_updates: true
        map_subscribe_transient_local: true
      nvblox_layer:
        plugin: "nvblox_nav2::NvbloxCostmapLayer"
        enabled: true
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: false
        max_obstacle_distance: 4.0
        inflation_distance: 0.7
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.8
        cost_scaling_factor: 2.5
      always_send_full_costmap: true
