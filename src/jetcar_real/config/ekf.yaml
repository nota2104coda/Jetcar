ekf_filter_node:
  ros__parameters:
    frequency: 10.0
    sensor_timeout: 0.2
    two_d_mode: true
    publish_tf: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Wheel Odometry (Speed only)
    odom0: /mcu/odom
    odom0_config: [false, false, false,
                  false, false, false,
                  true,  false, false,
                  false, false, false,
                  false, false, false]
    odom0_queue_size: 2

    # VSLAM Odometry (Pose + Velocity)
    odom1: /visual_slam/tracking/odometry
    odom1_config: [true,  true,  false,
                  false, false, true,
                  true,  false, false,
                  false, false, true,
                  false, false, false]
    odom1_queue_size: 2

    # IMU (Angular Velocity only - let VSLAM handle orientation)
    imu0: /mcu/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 5
    imu0_remove_gravitational_acceleration: true

    use_control: false
